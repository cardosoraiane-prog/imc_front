<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabs com api</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclik="abrirTab(0)">IMC </button>
        <button class="tab-btn" onclik="abrirTab(1)">MEDIA </button>
    </div>
    <a id="logout" class="logout-link" onclick="logout()">Logout</a>

    <div class="tab-content active">
        <h2>cadastro do cliente</h2>
        <input type="text" id="nome" placeholder=" Digite seu Nome">
        <input type="number" id="cpf" placeholder="Digite seu cpf">
        <input type="number" id="cep" placeholder="Digite seu cep">
        <input type="number" id="rua" placeholder="Digite seu rua">
        <input type="number" id="cidade" placeholder="Digite seu cidade">
        <input type="number" id="estado" placeholder="Digite seu estado">
        <input type="number" id="numero" placeholder="Digite seu numero">
        <button onclick="calcularImc()">calcular IMC</button>
        <div class="resultado" id="resultadoImc"> </div>
    </div>

    <div class="tab-content">
        <h2>calcular MEDIA</h2>
        <input type="number" id="nota1" placeholder="Digite seu nota1">
        <input type="number" id="nota2" placeholder="Digite seu nota2">
        <button onclick="calcularMedia()">calcular MEDIA</button>
        <div class="resultado" id="resultadoMedia"> </div>
    </div>

    <script scr ="index.js">
        function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}
    </script>

</body>
</html>

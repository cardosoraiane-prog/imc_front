<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabs com api</title>

</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclik="abrirTab(0)">IMC </button>
        <button class="tab-btn" onclik="abrirTab(1)">MEDIA </button>
    </div>
    <div class="tab-content active">
        <h2>calcular IMC</h2>
        <input type="text" id="nome" placeholder=" Digite seu Nome">
        <input type="number" id="idade" placeholder="Digite seu Idade">
        <input type="number" id="altura" placeholder="Digite seu Altura">
        <input type="number" id="peso" placeholder="Digite seu Peso">
        <button onclick="calcularImc()">calcular IMC</button>
        <div class="resultado" id="resultadoImc"> </div>
    </div>

    <div class="tab-content active">
        <h2>calcular MEDIA</h2>
        <input type="number" id="nota1" placeholder="Digite seu nota1">
        <input type="number" id="nota2" placeholder="Digite seu nota2">
        <button onclick="calcularMedia()">calcular MEDIA</button>
        <div class="resultado" id="resultadoMedia"> </div>
    </div>

    <script scr ="index.js"></script>

</body>

</html>
